services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [backend/.env]
    ports: ["8000:8000"]
    volumes: ["wp-data:/app/data"]
  frontend:
    build: { context: frontend }
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  wp-data:
